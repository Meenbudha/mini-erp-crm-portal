name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  # ─── 1. Type-check ──────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # ─── 2. Integration Tests ───────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (30/30)
    runs-on: ubuntu-latest
    needs: typecheck

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
          POSTGRES_DB: mini_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://erp_user:erp_password@localhost:5432/mini_erp_test
      JWT_SECRET: github-actions-test-secret-key-32-chars-min
      PORT: 5000
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed test users
        run: npx prisma db seed

      - name: Start backend server
        run: npx tsx src/server.ts &
        # Give the server a moment to boot before tests run

      - name: Wait for server to be ready
        run: |
          echo "Waiting for backend on port $PORT..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:$PORT/api/health > /dev/null; then
              echo "✅ Server is ready"
              break
            fi
            echo "  attempt $i/15 — retrying in 2s"
            sleep 2
          done

      - name: Run automated system tests (30 tests)
        run: npx tsx src/tests/system_test.ts
